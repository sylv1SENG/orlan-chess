# Déploie le site dans public_html/<SITE_DIR>/ chez PlanetHoster à chaque push sur main.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   FTP_SERVER    ex. world-366.fr.planethoster.net
#   FTP_USERNAME  deploy@sylvainsengbandith.fr (compte FTP dont le répertoire est public_html)
#   FTP_PASSWORD
name: Déploiement PlanetHoster

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le jeton GitHub du workflow n'a que le droit de lire le code
permissions:
  contents: read

# Un seul déploiement à la fois
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_DIR: echecs   # sous-dossier du site : sylvainsengbandith.fr/echecs/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Construire index.html
        run: |
          python3 build.py
          mkdir -p dist && cp index.html dist/ && cp deploy/.htaccess dist/

      - name: Envoyer par FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65  # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.SITE_DIR }}/   # le compte FTP démarre déjà dans public_html
